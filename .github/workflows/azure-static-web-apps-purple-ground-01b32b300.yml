name: Azure Static Web Apps CI/CD (Student Account Safe)

on:
push:
branches:
- master
pull_request:
types: [opened, synchronize, reopened, closed]
branches:
- master

jobs:
build_and_deploy_job:
runs-on: ubuntu-latest
permissions:
contents: read
id-token: write

```
steps:
  - name: Checkout code
    uses: actions/checkout@v3

  - name: Setup Node.js
    uses: actions/setup-node@v3
    with:
      node-version: '20'

  - name: Install dependencies
    run: |
      cd frontend/LandOfRex
      npm install

  - name: Build React App with Vite
    run: |
      cd frontend/LandOfRex
      npm run build

  - name: Copy staticwebapp.config.json into build
    run: |
      cp frontend/LandOfRex/public/staticwebapp.config.json frontend/LandOfRex/build/

  - name: List build content for debug
    run: |
      ls -R frontend/LandOfRex/build

  - name: Deploy to Azure Static Web Apps via OIDC
    uses: Azure/static-web-apps-deploy@v1
    with:
      app_location: "frontend/LandOfRex/build"
      output_location: ""
      api_location: ""
      github_id_token: ${{ github.token }}
      action: "upload"
```
