name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Install dependencies
        run: |
          cd frontend/LandOfRex
          npm install

      - name: Build React app
        run: |
          cd frontend/LandOfRex
          npm run build

      - name: Copy config to dist
        run: |
          cp frontend/LandOfRex/public/staticwebapp.config.json frontend/LandOfRex/dist/

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_GROUND_01B32B300 }}
          action: "upload"
          app_location: "./frontend/LandOfRex" # React 프로젝트 루트
          api_location: "" # API 없음
          output_location: "dist" # 빌드 결과물
