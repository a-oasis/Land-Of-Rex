name: CI/CD Pipeline to EC2 (EC2_PRIVATE_KEY 사용)

on:
  push:
    branches:
      - master  # master 브랜치에 푸시될 때마다 실행

jobs:
  deploy:
    runs-on: ubuntu-latest  # GitHub Actions 기본 빌드 환경 사용

    steps:
    # 1. SSH 키 설정
    - name: Set up SSH Private Key using EC2_PRIVATE_KEY
      uses: webfactory/ssh-agent@v0.8.0
      with:
        # Secret 이름을 EC2_PRIVATE_KEY로 변경
        ssh-private-key: ${{ secrets.EC2_PRIVATE_KEY }}

    # 2. EC2 접속 정보 변수 설정
    - name: Set EC2 connection variables
      id: set_vars
      run: |
        # 실제 EC2 Public IP 또는 DNS
        echo "EC2_HOST=ec2-3-112-70-125.ap-northeast-1.compute.amazonaws.com" >> $GITHUB_ENV
        # EC2 사용자 이름
        echo "EC2_USER=ubuntu" >> $GITHUB_ENV

    # =======================================================
    # A. Spring Backend 배포 (Build, Transfer, Deploy)
    # =======================================================
    - name: Checkout Spring Backend Code
      uses: actions/checkout@v3
      with:
        # 코드는 이 경로에 다운로드되며, 중첩 구조가 생깁니다.
        path: backend/landOfRex

    # ⚠️ Debug 스텝은 이제 필요하지 않으므로 주석 처리하거나 제거하는 것이 좋습니다.
    # - name: Debug Find gradlew in the entire workspace
    #   run: |
    #     find . -name "gradlew"

    # 3. gradlew 실행 권한 부여
    - name: Ensure gradlew is executable
      # ⚠️ 수정: 중첩된 경로를 working-directory로 지정
      working-directory: ./backend/landOfRex/backend/landOfRex 
      run: chmod +x gradlew
      
    # 4. Java 환경 설정
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '21' # Spring 프로젝트에 맞는 Java 버전
        distribution: 'temurin'
        
    # 5. Gradle 빌드
    - name: Build with Gradle
      # ⚠️ 수정: 중첩된 경로를 working-directory로 지정
      working-directory: ./backend/landOfRex/backend/landOfRex
      run: ./gradlew build -x test

    # 6. JAR 파일 EC2로 전송
    - name: Transfer Spring JAR to EC2
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ env.EC2_HOST }}
        username: ${{ env.EC2_USER }}
        key: ${{ secrets.EC2_PRIVATE_KEY }} 
        # ⚠️ 수정: 중첩된 경로를 source 경로에 포함
        source: "backend/landOfRex/backend/landOfRex/build/libs/*.jar"
        target: "/home/ubuntu/spring-deploy/" 

    # 7. EC2에서 배포 및 재시작
    - name: Deploy and Restart Spring Service
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.EC2_HOST }}
        username: ${{ env.EC2_USER }}
        key: ${{ secrets.EC2_PRIVATE_KEY }} 
        script: |
          # 1. 기존 서비스 중지
          sudo systemctl stop spring-app || true
          
          # 2. 전송된 JAR 파일이 있는지 확인하고 복사
          JAR_FILE=$(find /home/ubuntu/spring-deploy/ -name "*.jar" -print -quit)
          
          if [ -f "$JAR_FILE" ]; then
            echo "Found JAR: $JAR_FILE. Copying to app.jar..."
            sudo cp "$JAR_FILE" /home/ubuntu/spring-app/app.jar
            
            # 3. 서비스 시작
            sudo systemctl start spring-app
            sudo systemctl status spring-app
          else
            echo "ERROR: No JAR file found in /home/ubuntu/spring-deploy/. Deployment aborted."
            exit 1
          fi
          
    # =======================================================
    # B. React Frontend 배포 (Build, Transfer)
    # =======================================================
    - name: Checkout React Frontend Code
      uses: actions/checkout@v3
      with:
        path: react-app 

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies and Build React
      working-directory: ./react-app
      run: |
        npm install
        npm run build 

    - name: Transfer React Build Files to EC2 (NGINX Static Folder)
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ env.EC2_HOST }}
        username: ${{ env.EC2_USER }}
        key: ${{ secrets.EC2_PRIVATE_KEY }} 
        source: "react-app/build/*"
        # NGINX 설정에서 지정한 경로와 일치해야 합니다.
        target: "/var/www/html/react-app/" 
        overwrite: true
