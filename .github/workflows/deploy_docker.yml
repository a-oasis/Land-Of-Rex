name: CI/CD Pipeline with Docker Hub

on:
  push:
    branches:
      - master # ⚠️ master 브랜치에 푸시될 때 실행

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    # Docker Hub에 푸시하기 위해 packages 권한은 필요 없습니다.
    permissions:
      contents: read
      
    steps:
      # --- 1. CI 단계: 빌드 및 Docker Hub 이미지 생성 ---
      
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' # ⚠️ Java 21 사용
          distribution: 'temurin'

      - name: 🔒 Grant execute permission to gradlew
        run: chmod +x ./backend/landOfRex/gradlew
          
      - name: 📦 Build Spring Boot Application
        working-directory: ./backend/landOfRex
        run: ./gradlew clean build -x test # JAR 파일 빌드
        
      - name: 🐳 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          # Docker Hub 사용자 이름 (Secrets에 저장)
          username: ${{ secrets.DOCKER_USERNAME }} 
          # Docker Hub 비밀번호 (Access Token)
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: 🏗️ Define Image Tag
        id: image
        # ⚠️ Docker Hub 태그 정의: [Docker Hub Username]/[Repository Name]:latest
        run: echo "TAG=${{ secrets.DOCKER_USERNAME }}/spring-app:latest" >> $GITHUB_OUTPUT 
        # spring-app 부분은 프로젝트에 맞게 변경할 수 있습니다.
        
      - name: 🏗️ Build and Push Docker Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./backend/landOfRex
          push: true
          tags: ${{ steps.image.outputs.TAG }} 
          
          
      # --- 2. CD 단계: 배포 서버에 접속 및 실행 ---

      - name: 🗝️ Deploy using SSH and Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          # SSH 접속 정보 (Secrets에 저장)
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop_on_error: true
          # ⚠️ 배포 서버에서 docker-compose.yml 파일이 위치한 경로로 변경하세요.
          script: |
            # 1. 서버에서 작업 디렉토리로 이동
            cd /backend
            
            # 2. Docker Hub에서 최신 이미지 풀(Pull)
            sudo docker pull ${{ steps.image.outputs.TAG }}
            
            # 3. 기존 서비스 중지 및 새 컨테이너 실행 (Docker Compose)
            # docker-compose.yml 파일 내 image 이름이 Docker Hub 태그와 일치해야 합니다.
            sudo docker-compose -f docker-compose.yml up -d --force-recreate --no-deps 
            
            # 4. 실행 상태 확인
            sudo docker-compose ps
